<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js; connect-src https://tnzwhwitgnzoehbjrmoy.supabase.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
<!-- supabase-js は版を固定し、改ざんされていないことを integrity（SRI）で確かめてから使う（window.supabase）。CSP もこのファイルだけを許す -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
<title>A.I.KEN Studio 管理コンソール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&amp;display=swap">
<style>
  :root {
    --accent: #26396E; --accent-hover: #1B2B55; --on-accent: #FFFFFF;
    --accent-soft: #EEF1F6; --accent-soft-line: #C8D0DE; --accent-soft-text: #22325E;
    --bg: #F4F5F8; --surface: #FFFFFF; --surface-2: #F6F7F9; --seg: #E7E9EE;
    --text: #16181D; --text-2: #4A505B; --text-3: #2B2F36; --muted: #5B6270; --faint: #8C93A0;
    --line: #E3E6EB; --line-2: #DDE1E7; --line-soft: #EEF0F3; --input-line: #C9CED6; --dash: #B9C0CC; --dot: #C4C9D2;
    --track: #E9ECF1;
    --student-bg: #E6EAF2; --student-fg: #22325E;
    --member-bg: #E5ECEA; --member-fg: #355A54;
    --admin-bg: #ECEDF0; --admin-fg: #30343B;
    --instructor-bg: #ECE8F2; --instructor-fg: #4A3A66;
    --ok-bg: #E7EDE8; --ok-fg: #3D5B45;
    --warn-bg: #F5EFE7; --warn-fg: #74512C; --warn-card: #F7F2EB; --warn-line: #E5D7C5;
    --low: #A0573A; --low-text: #8A4B33;
    --danger: #96413A; --danger-line: #E2CDC9;
    --chip-on-bg: #16181D; --chip-on-fg: #FFFFFF;
    --scrim: rgba(26, 30, 38, 0.62);
    --shadow-fab: 0 6px 16px rgba(22, 30, 56, 0.24);
    --shadow-dialog: 0 20px 48px rgba(16, 20, 32, 0.30);
    --shadow-seg: 0 1px 2px rgba(20, 24, 32, 0.12);
    --font: "IBM Plex Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
  }
  /* ダーク表示：紺基調のまま明度を反転 */
  @media (prefers-color-scheme: dark) {
    :root {
      --accent: #A9B9E9; --accent-hover: #C3CFF2; --on-accent: #0E1322;
      --accent-soft: #1E2741; --accent-soft-line: #34406A; --accent-soft-text: #C7D2F2;
      --bg: #0E1220; --surface: #161B2B; --surface-2: #1C2234; --seg: #222A3E;
      --text: #E8EAF0; --text-2: #C2C7D2; --text-3: #D5D9E2; --muted: #A0A7B6; --faint: #7A8294;
      --line: #283048; --line-2: #323B54; --line-soft: #222A3E; --input-line: #3C4661; --dash: #4A5574; --dot: #4A5370;
      --track: #262E44;
      --student-bg: #243052; --student-fg: #C7D2F2;
      --member-bg: #1E3532; --member-fg: #A9D0C6;
      --admin-bg: #2A2E39; --admin-fg: #D0D4DC;
      --instructor-bg: #2E2640; --instructor-fg: #D2C6EC;
      --ok-bg: #1F3527; --ok-fg: #A9D4B4;
      --warn-bg: #3A2D1F; --warn-fg: #EBC79C; --warn-card: #2E2519; --warn-line: #5A4630;
      --low: #D8916F; --low-text: #EBA887;
      --danger: #EE968C; --danger-line: #5C3631;
      --chip-on-bg: #E8EAF0; --chip-on-fg: #0E1220;
      --scrim: rgba(4, 6, 12, 0.72);
      --shadow-fab: 0 6px 16px rgba(0, 0, 0, 0.5);
      --shadow-dialog: 0 20px 48px rgba(0, 0, 0, 0.6);
      --shadow-seg: 0 1px 2px rgba(0, 0, 0, 0.4);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: var(--font); font-size: 14px; line-height: 1.5;
  }
  [hidden] { display: none !important; }
  .num, input, .tabular { font-variant-numeric: tabular-nums; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .strong { font-weight: 600; }
  .error-text { color: var(--danger); }
  h1, h2, h3, p { margin: 0; }
  a { color: var(--accent); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- ボタン ---- */
  .btn {
    min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line-2);
    background: var(--surface); color: var(--text); font-weight: 700; font-size: 14px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
  }
  .btn:hover:not(:disabled) { border-color: var(--input-line); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn.soft { background: var(--accent-soft); border-color: var(--accent-soft-line); color: var(--accent-soft-text); }
  .btn.danger { color: var(--danger); border-color: var(--danger-line); }
  .btn.big { min-height: 52px; border-radius: 14px; font-size: 16px; }
  .btn.block { width: 100%; }
  .btn:disabled { opacity: 0.55; }
  .btn.primary:disabled { background: var(--seg); border-color: var(--seg); color: var(--text-2); opacity: 1; }
  .link-btn {
    min-height: 44px; padding: 0 6px; border: 0; background: transparent; color: var(--accent);
    font-weight: 700; display: inline-flex; align-items: center; gap: 6px;
  }
  .link-btn:hover:not(:disabled) { color: var(--accent-hover); text-decoration: underline; }
  .link-btn:disabled { color: var(--faint); }
  .icon-btn {
    flex: none; width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--line-2);
    background: var(--surface); color: var(--text-3); display: inline-flex; align-items: center; justify-content: center;
  }
  .icon-btn.bare { border: 0; background: transparent; border-radius: 12px; color: var(--muted); }
  .icon-btn.bare:hover { background: var(--surface-2); color: var(--danger); }

  /* ---- 入力 ---- */
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field > label, .field-label { font-size: 13px; font-weight: 600; }
  .hint { font-size: 12px; color: var(--muted); }
  .input, select.input, textarea.input {
    width: 100%; min-width: 0; height: 48px; padding: 0 14px; border: 1px solid var(--input-line); border-radius: 12px;
    background: var(--surface); color: var(--text); font-size: 16px;
  }
  textarea.input { height: auto; min-height: 150px; padding: 12px 14px; resize: vertical; line-height: 1.6; }
  select.input { padding: 0 12px; }
  input[type="date"].input { padding: 0 10px; }
  .input.now { border: 2px solid var(--accent); }
  .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  fieldset.plain { border: 0; margin: 0; padding: 0; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  fieldset.plain > legend { font-size: 13px; font-weight: 600; padding: 0; margin-bottom: 8px; }

  /* セグメント（タブ・1人ずつ/まとめて） */
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; padding: 4px; background: var(--seg); border-radius: 12px; }
  .seg > button, .seg > label {
    min-height: 40px; border-radius: 9px; border: 0; background: transparent; color: var(--text-2);
    font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative;
  }
  .seg > button[aria-current="page"], .seg > button[aria-selected="true"], .seg > label:has(input:checked) { background: var(--surface); color: var(--text); box-shadow: var(--shadow-seg); }
  .seg > label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 1px; }
  /* 選択チップ（区分） */
  .choice { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .choice > label {
    min-height: 44px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface); color: var(--text-3);
    font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0 6px; text-align: center;
  }
  .choice > label:has(input:checked) { background: var(--accent-soft); color: var(--accent-soft-text); border: 2px solid var(--accent); }
  .choice > label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  .choice input, .seg input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }

  /* ---- バッジ ---- */
  .badge { flex: none; display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; line-height: 1.5; }
  .badge.student { background: var(--student-bg); color: var(--student-fg); }
  .badge.member { background: var(--member-bg); color: var(--member-fg); }
  .badge.admin { background: var(--admin-bg); color: var(--admin-fg); }
  .badge.instructor { background: var(--instructor-bg); color: var(--instructor-fg); }
  .badge.stage { background: var(--accent-soft); color: var(--accent-soft-text); border: 1px solid var(--accent-soft-line); }
  .badge.ok { background: var(--ok-bg); color: var(--ok-fg); }
  .badge.stopped, .badge.ended { border: 1px solid var(--dot); color: var(--text-2); padding: 1px 8px; }
  .badge.active { background: var(--student-bg); color: var(--student-fg); font-weight: 700; padding: 3px 10px; }
  .badge.upcoming { background: var(--admin-bg); color: var(--admin-fg); font-weight: 700; padding: 3px 10px; }
  .badge.ended { font-weight: 700; padding: 2px 10px; }
  .badge.now { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 6px; background: var(--student-bg); color: var(--student-fg); margin-left: 8px; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; }

  /* ---- 段階（016）---- */
  .small-btn { min-height: 34px; padding: 0 10px; font-size: 13px; border-radius: 9px; }
  .danger-btn { color: var(--danger); }
  .stage-rows { display: flex; flex-direction: column; gap: 8px; }
  .stage-row { display: grid; grid-template-columns: 24px minmax(0, 2fr) minmax(0, 2fr) minmax(0, 1fr) auto; gap: 6px; align-items: center; }
  .stage-row .stage-no { color: var(--muted); text-align: right; font-size: 13px; }
  .stage-row .stage-actions { display: inline-flex; gap: 4px; }
  @media (max-width: 700px) {
    .stage-row { grid-template-columns: 24px minmax(0, 1fr) minmax(0, 1fr); }
    .stage-row .stage-actions { grid-column: 2 / -1; }
  }
  .stage-day { display: flex; flex-direction: column; gap: 4px; padding-top: 8px; }
  .templates { list-style: none; margin: 0; padding: 0; }
  .template-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line-soft); }
  .template-text { display: flex; flex-direction: column; min-width: 0; }
  .grants .grant-group-head { display: block; padding: 8px 0 2px; font-size: 13px; font-weight: 700; color: var(--text-2); }
  .grants .grant-total { display: block; padding: 4px 0 8px; border-top: 0; }
  .grants li.revoked .plus { color: var(--muted); text-decoration: line-through; }
  .grants li.revoked .gtext { color: var(--muted); }

  /* ---- 注意・バー ---- */
  .warn-box { display: flex; align-items: flex-start; gap: 8px; background: var(--warn-bg); color: var(--warn-fg); border-radius: 10px; padding: 8px 10px; font-size: 13px; font-weight: 500; }
  .warn-box svg { flex: none; margin-top: 2px; }
  .warn-text { color: var(--warn-fg); font-weight: 600; }
  .bar { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
  .bar.thick { height: 8px; border-radius: 4px; }
  .bar.thin { height: 5px; }
  .bar > span { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
  .bar.low > span { background: var(--low); }
  .low-text { color: var(--low-text); font-weight: 700; }

  /* ---- 読み込み・ログイン ---- */
  .center-card { max-width: 440px; margin: 12vh auto 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  .center-card .brand-sub { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
  .center-card h1 { font-size: 22px; }
  @media (max-width: 480px) { .center-card { margin: 10vh 16px 0; } }

  /* ---- 上部（画面の上に固定。講師の画面・マイページのヘッダーもこれと同じ見た目）---- */
  /* --topbar-h ＝ 固定したヘッダーの高さ（ノッチ分を含む）。ヘッダーの下に隠れてはいけない部品（右の詳細・お知らせ・移動先）はこの 1 か所の値で下げる */
  :root { --topbar-h: calc(150px + env(safe-area-inset-top)); } /* 900px 未満（名前・タブ・アバターの 2 段）。実測 150px */
  :root:has(body.selecting) { --topbar-h: 0px; } /* 選択中はヘッダーを隠す */
  html { scroll-padding-top: var(--topbar-h); }
  .topbar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
  .topbar-inner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 20px 12px; }
  .brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .brand-sub { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
  .brand h1 { font-size: 22px; font-weight: 700; letter-spacing: 0.01em; }
  .tabs { order: 3; flex: 1 1 100%; margin: 0 -4px; }
  .tabs > button { min-height: 44px; }
  .avatar { width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--line-2); background: var(--surface); color: var(--accent); font-weight: 700; }
  .account { display: none; }
  /* スマホの幅（560px 以下）：詰めて常に表示する。小さい見出しは隠し、題名・アバター・タブを小さくする（押せる範囲は 40px 以上）。実測 109px */
  @media (max-width: 560px) {
    :root { --topbar-h: calc(109px + env(safe-area-inset-top)); }
    :root:has(body.selecting) { --topbar-h: 0px; }
    .topbar-inner { padding: 8px 16px; gap: 8px; }
    .topbar .brand-sub { display: none; } /* ログイン画面のカードの見出しは残す */
    .brand h1 { font-size: 18px; }
    .tabs > button { min-height: 40px; }
    .avatar { position: relative; width: 36px; height: 36px; border-radius: 18px; }
    .avatar::after { content: ""; position: absolute; inset: -4px; } /* 見た目は 36px、押せる範囲は 44px */
  }

  /* ---- お知らせ（浮かぶトースト。画面の上に固定。押し下げない） ---- */
  #notice {
    position: fixed; z-index: 30; top: calc(max(var(--topbar-h), env(safe-area-inset-top)) + 8px); left: 50%; transform: translateX(-50%); /* 固定したヘッダーの下に出す（選択中でヘッダーが無いときはノッチの下） */
    width: min(560px, calc(100% - 32px)); max-height: calc(100dvh - max(var(--topbar-h), env(safe-area-inset-top)) - 24px); overflow: hidden;
    display: flex; flex-direction: column; gap: 8px; pointer-events: none;
  }
  #notice .toast {
    pointer-events: auto; display: flex; gap: 8px; align-items: flex-start; max-height: 40vh; overflow: auto;
    background: var(--surface); color: var(--text); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 12px;
    box-shadow: var(--shadow-dialog); padding: 10px 6px 10px 14px;
  }
  #notice .toast.error { border-left-color: var(--danger); }
  #notice .toast.warn { border-left-color: var(--warn-fg); background: var(--warn-bg); color: var(--warn-fg); }
  #notice .notice-body { flex: 1 1 auto; min-width: 0; padding-top: 2px; overflow-wrap: anywhere; }
  #notice .toast.error .notice-msg { color: var(--danger); font-weight: 600; }
  #notice .toast.warn .notice-msg { font-weight: 600; }
  #notice .notice-count { margin-left: 6px; color: var(--muted); font-weight: 700; }
  #notice ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; }
  /* PC 幅：上の帯（タブ・最終更新）にかからないよう、帯の下の右寄せに出す */
  @media (min-width: 900px) {
    #notice { left: auto; right: 24px; transform: none; width: min(480px, calc(100% - 48px)); }
  }
  @media (prefers-reduced-motion: no-preference) {
    #notice .toast { animation: toast-in 0.18s ease-out; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  }

  /* ---- 本体 ---- */
  .content { padding-bottom: 120px; }
  body.selecting .content { padding-bottom: 180px; }
  .overview { margin: 0 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 4px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .ov-item { display: flex; flex-direction: column; gap: 2px; padding: 0 10px; min-width: 0; border: 0; background: transparent; text-align: left; color: inherit; }
  .ov-item + .ov-item { border-left: 1px solid var(--line-soft); }
  .ov-label { font-size: 12px; color: var(--muted); }
  .ov-value { font-size: 22px; font-weight: 700; line-height: 1.3; }
  .ov-value .unit { font-size: 13px; font-weight: 500; margin-left: 2px; }
  .ov-sub { font-size: 12px; color: var(--muted); }
  .ov-item.warn .ov-value, .ov-item.warn .ov-sub { color: var(--warn-fg); }
  button.ov-item:hover .ov-label { text-decoration: underline; }
  .ov-line { padding: 6px 20px 8px; font-size: 13px; color: var(--muted); }

  .split { display: block; }
  .side-panel { display: none; }
  .panel-head { display: flex; flex-direction: column; gap: 12px; padding: 16px 16px 0; }
  .panel-head h2 { display: none; }
  .search { position: relative; }
  .search svg { position: absolute; left: 14px; top: 13px; color: var(--muted); pointer-events: none; }
  .search input { width: 100%; height: 44px; padding: 0 14px 0 40px; border: 1px solid var(--line-2); border-radius: 12px; background: var(--surface); color: var(--text); font-size: 16px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px 2px; scrollbar-width: none; }
  .chip { flex: none; min-height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--line-2); background: var(--surface); color: var(--text-3); font-size: 13px; font-weight: 600; }
  .chip[aria-pressed="true"] { background: var(--chip-on-bg); color: var(--chip-on-fg); border-color: var(--chip-on-bg); }
  .chip .count { margin-left: 6px; opacity: 0.75; }
  .count-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px 8px; font-size: 13px; color: var(--muted); }
  .count-row .link-btn { font-size: 14px; }
  #roster-banner:not(:empty) { padding: 0 16px 10px; }
  @media (min-width: 900px) { .count-row { padding: 10px 16px; min-height: 0; } }

  /* 名簿のカード（スマホ） */
  .list { list-style: none; margin: 0; padding: 0 16px; display: flex; flex-direction: column; gap: 10px; }
  .card {
    width: 100%; display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 16px; padding: 14px 16px; text-align: left; color: var(--text);
  }
  button.card:hover { border-color: var(--input-line); }
  .card-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .card-name { font-size: 16px; font-weight: 600; flex: 1 1 auto; }
  .card-email { font-size: 13px; color: var(--muted); margin-top: -6px; }
  .quota { display: flex; flex-direction: column; gap: 6px; }
  .quota-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .quota-label { font-size: 12px; color: var(--muted); }

  /* 選択モード */

  .selhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: calc(12px + env(safe-area-inset-top)) 12px 12px 20px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: var(--topbar-h); z-index: 5; }

  /* ---- 設定 ---- */

  .model-name { font-weight: 700; overflow-wrap: anywhere; }
  /* モデルのオン・オフ：スイッチは 32×18（つまみ 14）。押せる範囲は行の label 全体（最小の高さ 36px） */
  .toggle { display: flex; align-items: center; gap: 10px; min-height: 36px; cursor: pointer; }
  .toggle.locked { cursor: not-allowed; }
  .toggle input { appearance: none; -webkit-appearance: none; flex: none; width: 32px; height: 18px; margin: 0; border-radius: 9px; background: var(--seg); border: 1px solid var(--input-line); position: relative; cursor: inherit; }

  .model-tabs { margin: 2px 0 10px; }

  /* モデルの行：名前（押すと開く）・全体のスイッチ・開閉のボタン。モードごとのスイッチは普段は隠し、開くと上から下へすっと出る */
  .model-row { display: flex; align-items: center; gap: 8px; }

  /* 区分のタブ：文字を語の途中で割らない（狭い幅では文字と余白を小さくする） */
  .model-tabs { grid-auto-columns: minmax(max-content, 1fr); }

  }

  /* 切り替えが 2 つ以上（押すと開閉する）の状態の文字は折り返さない。1 つのモデルは折り返してよい（名前の欄を 96px 以上に保つ） */
  .tstate.mstate.clickable:not(.provider_off):not(.server_off):not(.global_off):not(.route_off) { max-width: none; white-space: nowrap; }
  .tstate.mstate:not(.clickable), .tstate.mstate.provider_off, .tstate.mstate.server_off, .tstate.mstate.global_off, .tstate.mstate.route_off { flex: 0 1 auto; min-width: 4.5em; }
  .tstate.mstate.clickable, .model-main.clickable { cursor: pointer; }
  .toggle.switch-only { padding: 0 6px; }
  .chev-btn, .chev-space { flex: none; width: 32px; height: 36px; }
  .chev-btn { display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; padding: 0; }

  .save-bar { position: sticky; bottom: 0; z-index: 4; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; background: var(--surface); border-top: 1px solid var(--line); margin: 0 -16px -14px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); border-radius: 0 0 16px 16px; }

  /* ---- 下から出るシート（スマホ）／中央のダイアログ（PC） ---- */

    .ov-item { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
    .ov-item + .ov-item { border-left: 1px solid var(--line); }
    .ov-item.warn { background: var(--warn-card); border-color: var(--warn-line); }

    .split { display: flex; gap: 16px; align-items: flex-start; }
    .list-panel { flex: 999 1 560px; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; overflow: clip; } /* clip：角を丸く切るが、中の .selhead は貼り付ける */

    .save-bar { margin: 0 -20px -18px; padding: 12px 20px; }
    .side-panel {
      display: flex; flex-direction: column; gap: 14px; flex: 1 1 360px; min-width: 0; max-width: 440px; background: var(--surface); border: 1px solid var(--line);
      border-radius: 16px; padding: 18px; position: sticky; top: calc(var(--topbar-h) + 16px); max-height: calc(100vh - var(--topbar-h) - 32px); overflow: auto;
    }
    .side-panel .box, .side-panel .menu { background: var(--surface-2); border-color: transparent; }
    .side-panel .stat { background: var(--surface); }
    .side-panel .title-lg { font-size: 18px; }
    .side-panel .big-n { font-size: 32px; }
    .side-empty { color: var(--muted); padding: 24px 4px; text-align: center; }
    .panel-head { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line-soft); }
    body.selecting .panel-head { display: flex !important; }
    .panel-head h2 { display: block; font-size: 16px; font-weight: 700; margin-right: auto; }
    .panel-head .search { flex: 1 1 220px; max-width: 320px; }
    .panel-head .search input { height: 40px; font-size: 14px; border-radius: 10px; }
    .panel-head .search svg { top: 11px; }
    .panel-head .btn { min-height: 40px; border-radius: 10px; }
    .chips { padding: 12px 16px; border-bottom: 1px solid var(--line-soft); flex-wrap: wrap; }
    body.selecting .chips { display: flex !important; }
    .list { padding: 0; gap: 0; }
    .empty { margin: 16px; }
    .trow {
      display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 0.9fr) minmax(0, 1.8fr) minmax(0, 1.3fr); gap: 12px;
      padding: 12px 16px; min-height: 60px; align-items: center; width: 100%; border: 0; background: transparent; color: var(--text); text-align: left;
    }
    .list > li + li .trow, .list > li + li .pick { border-top: 1px solid var(--line-soft); }
    .trow.head { min-height: 0; padding: 10px 16px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line-soft); }
    .trow.cohort { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.4fr) minmax(0, 1.6fr) minmax(0, 0.8fr) minmax(0, 1.6fr); min-height: 64px; }
    button.trow:hover { background: var(--surface-2); }
    .trow.is-selected { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
    .cell { display: flex; flex-direction: column; gap: 2px; min-width: 0; align-items: flex-start; }
    .cell.stretch { align-items: stretch; gap: 4px; }
    .cell > * { max-width: 100%; }
    .pick { border-radius: 0; border: 0; min-height: 56px; padding: 10px 16px; }
    .pick:has(input:checked) { border: 0; padding: 10px 16px; background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
    .selhead { padding: calc(10px + env(safe-area-inset-top)) 16px 10px; border-bottom: 1px solid var(--line-soft); }
    .selhead h2 { font-size: 16px; }
    .sel-hint { padding: 10px 16px; border-bottom: 1px solid var(--line-soft); }
    .selectbar-inner { flex-direction: row; align-items: center; justify-content: flex-end; }
    .selectbar .btn.big { min-height: 44px; font-size: 14px; border-radius: 12px; padding: 0 20px; }
    .selectbar .row { grid-auto-columns: auto; }
    .fab { display: none; }
    .venues { padding: 0 16px; }
    .venues li { min-height: 56px; border-top: 0; }
    .venues li + li { border-top: 1px solid var(--line-soft); }
    .card-section-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line-soft); }
    .card-section-head h2 { font-size: 16px; font-weight: 700; margin-right: auto; }
    .cohort-dates { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .cohort-dates .day2-cell { grid-column: auto; order: 3; }
    .cohort-dates .preview-cell { order: 4; }
    .id-preview { background: var(--surface-2); border-radius: 12px; }
    .id-preview .hint { max-width: 240px; }

    dialog.sheet {
      inset: 0; margin: auto; width: min(600px, calc(100vw - 48px)); max-height: calc(100dvh - 96px); height: fit-content;
      border-radius: 18px; background: var(--surface); box-shadow: var(--shadow-dialog);
    }
    .sheet-grab { display: none; }
    .sheet-head { padding: 14px 16px 14px 22px; border-bottom: 1px solid var(--line-soft); align-items: center; }
    .sheet-head h2 { font-size: 18px; padding: 0; }
    .sheet-head .icon-btn { border: 0; width: 40px; height: 40px; }
    .sheet-body { padding: 20px 22px; gap: 16px; }
    .sheet-body .box { background: var(--surface-2); border-color: transparent; }
    .sheet-foot { flex-direction: row-reverse; justify-content: flex-start; gap: 10px; padding: 14px 22px 18px; border-top: 1px solid var(--line-soft); }
    .sheet-foot .btn.big { min-height: 42px; font-size: 14px; border-radius: 10px; padding: 0 20px; }
    .sheet-foot .btn.cancel { border: 1px solid var(--line-2); color: var(--text); }
    .input, select.input { height: 42px; border-radius: 10px; font-size: 15px; }
  }
  /* 横向きのスマホ（高さが低い）：画面を圧迫するので固定しない */
  @media (orientation: landscape) and (max-height: 500px) {
    :root, :root:has(body.selecting) { --topbar-h: 0px; }
    .topbar { position: static; }
  }
  @media (max-width: 899.98px) {
    .desk-only { display: none !important; }
    .trow.head { display: none; }
  }
  @media (max-width: 360px) {
    .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .choice { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>
</head>
<body>
<div id="status" class="center-card"><p class="muted">読み込み中…</p></div>

<section id="login" class="center-card" hidden aria-labelledby="login-title">
  <span class="brand-sub">A.I.KEN Studio</span>
  <h1 id="login-title">管理コンソール</h1>
  <p class="warn-text" id="login-note" role="status" hidden></p>
  <p>管理者の Google アカウントでログインしてください。</p>
  <p class="muted small">ログインはこのタブを閉じるまで、または 30 分操作しないまで有効です。</p>
  <button type="button" class="btn primary big" id="login-btn">Google でログイン</button>
</section>

<section id="denied" class="center-card" hidden aria-labelledby="denied-title">
  <span class="brand-sub">A.I.KEN Studio</span>
  <h1 id="denied-title">管理コンソール</h1>
  <p class="error-text">管理者の権限がありません。</p>
  <p class="muted">ログイン中のアカウント：<span id="denied-email" class="tabular"></span></p>
  <button type="button" class="btn" id="denied-logout-btn">ログアウト</button>
</section>

<div id="app" hidden>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-sub">A.I.KEN Studio</span>
        <h1>管理コンソール</h1>
      </div>
      <nav class="tabs seg" aria-label="表示の切り替え">
        <button type="button" id="tab-roster" aria-current="page">名簿</button>
        <button type="button" id="tab-cohorts">回</button>
        <button type="button" id="tab-settings">設定</button>
      </nav>
      <div class="account">
        <span id="me-email" class="ellipsis"></span>
        <span class="small">最終更新 <span id="updated-at" class="tabular">—</span></span>
        <button type="button" class="btn" id="reload-btn">再読み込み</button>
        <button type="button" class="btn" id="logout-btn">ログアウト</button>
      </div>
      <button type="button" class="avatar" id="account-btn" aria-label="アカウント">？</button>
    </div>
  </header>

  <main class="content">
    <section id="overview" class="overview" aria-label="概要"></section>
    <p id="overview-line" class="ov-line tabular" hidden></p>

    <div id="view-roster" class="split">
      <section class="list-panel" aria-labelledby="roster-title">
        <div id="roster-selhead"></div>
        <div class="panel-head">
          <h2 id="roster-title">名簿</h2>
          <div class="search">
            <label for="q" class="sr-only">名前・メールで検索</label>
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
            <input id="q" type="search" placeholder="名前・メールで検索" autocomplete="off">
          </div>
          <button type="button" class="btn desk-only" id="select-btn-desk">選択</button>
          <button type="button" class="btn primary desk-only" id="add-btn-desk">追加</button>
        </div>
        <div class="chips" role="group" aria-label="絞り込み" id="chips"></div>
        <div class="count-row">
          <span id="shown-count" class="tabular"></span>
          <button type="button" class="link-btn mobile-only" id="select-btn">選択</button>
        </div>
        <div id="roster-banner" role="status"></div>
        <div id="roster-list"></div>
      </section>
      <aside class="side-panel" id="roster-aside" aria-label="選んだ人の詳細"></aside>
    </div>

    <div id="view-cohorts" class="split" hidden>
      <div class="stack-panel" id="cohorts-main"></div>
      <aside class="side-panel" id="cohort-aside" aria-label="選んだ回の設定"></aside>
    </div>

    <div id="view-settings" class="settings" hidden aria-labelledby="settings-title">
      <h2 id="settings-title" class="sr-only">設定</h2>
      <div class="settings-col" id="settings-main"></div>
      <div class="settings-col" id="settings-models"></div>
      <div class="settings-wide" id="settings-history"></div>
    </div>
  </main>

  <button type="button" class="fab" id="fab"></button>
  <div class="selectbar" id="selectbar" hidden></div>
</div>

<dialog id="sheet" class="sheet" aria-labelledby="sheet-title"></dialog>
<script type="module" src="./topbar-height.js"></script>
<script type="module" src="./admin.js"></script>
</body>
</html>
