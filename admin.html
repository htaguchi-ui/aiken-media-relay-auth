<style>
  /* 色・余白・角丸・ボタン・上部の帯の土台は共通の studio.css（マイページと同じ値。--muted・--low-text は重要な数字が明暗とも 7:1 になる値）。
     ここには管理コンソールだけが使う変数と、一覧・表・シートの形を置く（同じ名前の部品は、ここが後に読まれるので勝つ） */
  :root {
    --text-3: #2B2F36; --faint: #8C93A0; --dash: #B9C0CC; --dot: #C4C9D2;
    --warn-card: #F7F2EB;
    /* 重要な数字の色：実際の背景との組で 7:1 以上（Codex TASK-0092 F5）。
       --warn-strong は要対応のカード（--warn-card 7.66:1・白 8.53:1）、--low-strong は選んだ行（--accent-soft 7.84:1）の残りの少ない数 */
    --warn-strong: #66461F; --low-strong: #703C28;
    --chip-on-bg: #16181D; --chip-on-fg: #FFFFFF;
    --scrim: rgba(26, 30, 38, 0.62);
    --shadow-fab: 0 6px 16px rgba(22, 30, 56, 0.24);
    --shadow-dialog: 0 20px 48px rgba(16, 20, 32, 0.30);
    --shadow-seg: 0 1px 2px rgba(20, 24, 32, 0.12);
  }
  /* ダーク表示：紺基調のまま明度を反転 */
  @media (prefers-color-scheme: dark) {
    :root {
      --text-3: #D5D9E2; --faint: #7A8294; --dash: #4A5574; --dot: #4A5370;
      --warn-card: #2E2519;
      --warn-strong: #EBC79C; --low-strong: #EBA887; /* 暗い配色は元の値で 7:1 以上（9.45:1・7.37:1） */
      --chip-on-bg: #E8EAF0; --chip-on-fg: #0E1220;
      --scrim: rgba(4, 6, 12, 0.72);
      --shadow-fab: 0 6px 16px rgba(0, 0, 0, 0.5);
      --shadow-dialog: 0 20px 48px rgba(0, 0, 0, 0.6);
      --shadow-seg: 0 1px 2px rgba(0, 0, 0, 0.4);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: var(--font); font-size: 14px; line-height: 1.5;
  }
  [hidden] { display: none !important; }
  .num, input, .tabular { font-variant-numeric: tabular-nums; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .strong { font-weight: 600; }
  .error-text { color: var(--danger); }
  h1, h2, h3, p { margin: 0; }
  a { color: var(--accent); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- ボタン ---- */
  .btn {
    min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line-2);
    background: var(--surface); color: var(--text); font-weight: 700; font-size: 14px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
  }
  .btn:hover:not(:disabled) { border-color: var(--input-line); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn.soft { background: var(--accent-soft); border-color: var(--accent-soft-line); color: var(--accent-soft-text); }
  .btn.danger { color: var(--danger); border-color: var(--danger-line); }
  .btn.big { min-height: 52px; border-radius: 14px; font-size: 16px; }
  .btn.block { width: 100%; }
  .btn:disabled { opacity: 0.55; }
  .btn.primary:disabled { background: var(--seg); border-color: var(--seg); color: var(--text-2); opacity: 1; }
  .link-btn {
    min-height: 44px; padding: 0 6px; border: 0; background: transparent; color: var(--accent);
    font-weight: 700; display: inline-flex; align-items: center; gap: 6px;
  }
  .link-btn:hover:not(:disabled) { color: var(--accent-hover); text-decoration: underline; }
  .link-btn:disabled { color: var(--faint); }
  .icon-btn {
    flex: none; width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--line-2);
    background: var(--surface); color: var(--text-3); display: inline-flex; align-items: center; justify-content: center;
  }
  .icon-btn.bare { border: 0; background: transparent; border-radius: 12px; color: var(--muted); }
  .icon-btn.bare:hover { background: var(--surface-2); color: var(--danger); }

  /* ---- 入力 ---- */
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field > label, .field-label { font-size: 13px; font-weight: 600; }
  .hint { font-size: 12px; color: var(--muted); }
  .input, select.input, textarea.input {
    width: 100%; min-width: 0; height: 48px; padding: 0 14px; border: 1px solid var(--input-line); border-radius: 12px;
    background: var(--surface); color: var(--text); font-size: 16px;
  }
  textarea.input { height: auto; min-height: 150px; padding: 12px 14px; resize: vertical; line-height: 1.6; }
  select.input { padding: 0 12px; }
  input[type="date"].input { padding: 0 10px; }
  .input.now { border: 2px solid var(--accent); }
  .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  fieldset.plain { border: 0; margin: 0; padding: 0; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  fieldset.plain > legend { font-size: 13px; font-weight: 600; padding: 0; margin-bottom: 8px; }

  /* セグメント（タブ・1人ずつ/まとめて） */
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; padding: 4px; background: var(--seg); border-radius: 12px; }
  .seg > button, .seg > label {
    min-height: 40px; border-radius: 9px; border: 0; background: transparent; color: var(--text-2);
    font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative;
  }
  .seg > button[aria-current="page"], .seg > button[aria-selected="true"], .seg > label:has(input:checked) { background: var(--surface); color: var(--text); box-shadow: var(--shadow-seg); }
  .seg > label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 1px; }
  /* 選択チップ（区分） */
  .choice { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .choice > label {
    min-height: 44px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface); color: var(--text-3);
    font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0 6px; text-align: center;
  }
  .choice > label:has(input:checked) { background: var(--accent-soft); color: var(--accent-soft-text); border: 2px solid var(--accent); }
  .choice > label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  .choice input, .seg input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }

  /* ---- バッジ ---- */
  .badge { flex: none; display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; line-height: 1.5; }
  .badge.student { background: var(--student-bg); color: var(--student-fg); }
  .badge.member { background: var(--member-bg); color: var(--member-fg); }
  .badge.admin { background: var(--admin-bg); color: var(--admin-fg); }
  .badge.instructor { background: var(--instructor-bg); color: var(--instructor-fg); }
  .badge.stage { background: var(--accent-soft); color: var(--accent-soft-text); border: 1px solid var(--accent-soft-line); }
  .badge.ok { background: var(--ok-bg); color: var(--ok-fg); }
  .badge.stopped, .badge.ended { border: 1px solid var(--dot); color: var(--text-2); padding: 1px 8px; }
  .badge.active { background: var(--student-bg); color: var(--student-fg); font-weight: 700; padding: 3px 10px; }
  .badge.upcoming { background: var(--admin-bg); color: var(--admin-fg); font-weight: 700; padding: 3px 10px; }
  .badge.ended { font-weight: 700; padding: 2px 10px; }
  .badge.now { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 6px; background: var(--student-bg); color: var(--student-fg); margin-left: 8px; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; }

  /* ---- 段階（016）---- */
  .small-btn { min-height: 34px; padding: 0 10px; font-size: 13px; border-radius: 9px; }
  .danger-btn { color: var(--danger); }
  .stage-rows { display: flex; flex-direction: column; gap: 8px; }
  .stage-row { display: grid; grid-template-columns: 24px minmax(0, 2fr) minmax(0, 2fr) minmax(0, 1fr) auto; gap: 6px; align-items: center; }
  .stage-row .stage-no { color: var(--muted); text-align: right; font-size: 13px; }
  .stage-row .stage-actions { display: inline-flex; gap: 4px; }
  @media (max-width: 700px) {
    .stage-row { grid-template-columns: 24px minmax(0, 1fr) minmax(0, 1fr); }
    .stage-row .stage-actions { grid-column: 2 / -1; }
  }
  .stage-day { display: flex; flex-direction: column; gap: 4px; padding-top: 8px; }
  .templates { list-style: none; margin: 0; padding: 0; }
  .template-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line-soft); }
  .template-text { display: flex; flex-direction: column; min-width: 0; }
  .grants .grant-group-head { display: block; padding: 8px 0 2px; font-size: 13px; font-weight: 700; color: var(--text-2); }
  .grants .grant-total { display: block; padding: 4px 0 8px; border-top: 0; }
  .grants li.revoked .plus { color: var(--muted); text-decoration: line-through; }
  .grants li.revoked .gtext { color: var(--muted); }

  /* ---- 注意・バー ---- */
  .warn-box { display: flex; align-items: flex-start; gap: 8px; background: var(--warn-bg); color: var(--warn-fg); border-radius: 10px; padding: 8px 10px; font-size: 13px; font-weight: 500; }
  .warn-box svg { flex: none; margin-top: 2px; }
  /* 提出の受け付けの終わり（admin-submissions.js。回の詳細の中） */
  .deadline-stage { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line-soft); }
  .deadline-stage:first-of-type { border-top: 0; }
  .deadline-stage h3 { font-size: 14px; }
  .deadline-events { padding-left: 1.2em; }
  .warn-text { color: var(--warn-fg); font-weight: 600; }
  .bar { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
  .bar.thick { height: 8px; border-radius: 4px; }
  .bar.thin { height: 5px; }
  .bar > span { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
  .bar.low > span { background: var(--low); }
  .low-text { color: var(--low-text); font-weight: 700; }

  /* ---- 読み込み・ログイン ---- */
  .center-card { max-width: 440px; margin: 12vh auto 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  .center-card .brand-sub { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
  .center-card:not(.welcome) h1 { font-size: 22px; } /* ログイン前（.welcome）は studio.css の大きさ */
  .center-card.welcome .brand-sub { margin-top: -10px; font-size: 13px; color: var(--text-2); }
  @media (max-width: 480px) { .center-card { margin: 10vh 16px 0; } }
  /* ログイン前のカードは、トップ（studio.css の .center-card）と同じ幅・余白にそろえる */
  .center-card.welcome { max-width: 480px; padding: 40px 28px 32px; }
  @media (max-width: 480px) { .center-card.welcome { margin: 6vh 16px 32px; padding: 32px 20px 24px; } }

  /* ---- 上部（画面の上に固定。すりガラス・横向きで固定しない・高さの補助は studio.css と topbar-height.js の共通の作り）---- */
  /* 共通の骨組み（2026-10-23 田口さん）：ヘッダーは 1 段。左に題名、右に 画面の間の移動 → 更新 → アカウント（スマホはアカウントだけ。
     更新はアカウントのシートの中）。［名簿］［回］［設定］はヘッダーの外の左のメニュー（.side-menu）。
     --topbar-h ＝ 固定したヘッダーの高さ（ノッチ分を含む）。ここは幅ごとの実測の初期値で、topbar-height.js が実際の高さに入れ直す */
  :root { --topbar-h: calc(61px + env(safe-area-inset-top)); } /* 900px 未満（1 段）。実測 61px */
  :root:has(body.selecting) { --topbar-h: 0px; } /* 選択中はヘッダーを隠す */
  .topbar-inner { max-width: none; gap: 8px; padding: 8px 12px; }
  .brand h1 { font-size: 15px; white-space: nowrap; } /* 1 段に収めるため、狭い幅の題名は 15px（390px でも出る） */
  .account { display: none; }
  .avatar {
    flex: none; width: 44px; height: 44px; border-radius: var(--r-m); border: 1px solid var(--line-2); background: var(--surface);
    color: var(--text); display: inline-flex; align-items: center; justify-content: center; padding: 0;
  }
  .avatar:hover { border-color: var(--input-line); background: var(--surface-2); }
  /* 題名「管理コンソール」の幅（実測：狭い幅の 15px で 106px・20px で 141px）より題名の欄が狭いときは、題名を読み上げだけに残す
     （site-nav.css の container: brand。今いる画面は帯の歯車の印で分かる） */
  @media (max-width: 899.98px) { @container brand (max-width: 106.98px) { .brand h1 { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; } } }
  @media (min-width: 900px) { @container brand (max-width: 142.98px) { .brand h1 { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; } } }
  /* 左のメニュー：狭い幅（900px 未満）はヘッダーの下の細い横の切り替え（管理コンソールの .seg と同じ見た目。ヘッダーと一緒には貼り付けない） */
  .side-menu { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 2px; padding: 3px; margin: 8px 12px 0; background: var(--seg); border-radius: var(--r-m); }
  .side-item {
    min-height: 44px; min-width: 0; padding: 0 8px; border: 0; border-radius: 9px; background: transparent; color: var(--text-2);
    font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
  }
  .side-item .site-nav-icon { flex: none; }
  .side-item[aria-current="page"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow-seg); }
  body.selecting .side-menu { display: none; } /* 選択中は、ヘッダーと同じく隠す（選択の見出しを上に） */
  .checked { font-size: 13px; color: var(--text-2); white-space: nowrap; }
  /* 「確認 HH:mm」はヘッダーに出さない（アカウントのシートにある）。読み直せていない印（⚠ と短い文）があるときだけ、その印だけ出す */
  #checked-at:not(:has(.stale-mark)) { display: none; }
  #checked-at { font-size: 0; } /* 時刻の文字（印の前の文字）は見せない */
  #checked-at .stale-mark { font-size: 13px; }
  .stale-mark { display: inline-flex; align-items: center; gap: 4px; color: var(--warn-fg); font-weight: 600; }

  /* ---- お知らせ（浮かぶトースト。画面の上に固定。押し下げない） ---- */
  #notice {
    position: fixed; z-index: 30; top: calc(max(var(--topbar-h), env(safe-area-inset-top)) + 8px); left: 50%; transform: translateX(-50%); /* 固定したヘッダーの下に出す（選択中でヘッダーが無いときはノッチの下） */
    width: min(560px, calc(100% - 32px)); max-height: calc(100dvh - max(var(--topbar-h), env(safe-area-inset-top)) - 24px); overflow: hidden;
    display: flex; flex-direction: column; gap: 8px; pointer-events: none;
  }
  #notice .toast {
    pointer-events: auto; display: flex; gap: 8px; align-items: flex-start; max-height: 40vh; overflow: auto;
    background: var(--surface); color: var(--text); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 12px;
    box-shadow: var(--shadow-dialog); padding: 10px 6px 10px 14px;
  }
  #notice .toast.error { border-left-color: var(--danger); }
  #notice .toast.warn { border-left-color: var(--warn-fg); background: var(--warn-bg); color: var(--warn-fg); }
  #notice .notice-body { flex: 1 1 auto; min-width: 0; padding-top: 2px; overflow-wrap: anywhere; }
  #notice .toast.error .notice-msg { color: var(--danger); font-weight: 600; }
  #notice .toast.warn .notice-msg { font-weight: 600; }
  #notice .notice-count { margin-left: 6px; color: var(--muted); font-weight: 700; }
  #notice ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; }
  /* PC 幅：上の帯（タブ・最終更新）にかからないよう、帯の下の右寄せに出す */
  @media (min-width: 900px) {
    #notice { left: auto; right: 24px; transform: none; width: min(480px, calc(100% - 48px)); }
  }
  @media (prefers-reduced-motion: no-preference) {
    #notice .toast { animation: toast-in 0.18s ease-out; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  }

  /* ---- 本体 ---- */
  .content { max-width: none; margin: 0; padding: 12px 0 120px; display: block; } /* studio.css の .content（880px の 1 列）は使わない */
  body.selecting .content { padding-bottom: 180px; }
  .overview { margin: 0 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 4px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .ov-item { display: flex; flex-direction: column; gap: 2px; padding: 0 10px; min-width: 0; border: 0; background: transparent; text-align: left; color: inherit; }
  .ov-item + .ov-item { border-left: 1px solid var(--line-soft); }
  .ov-label { font-size: 12px; color: var(--muted); }
  .ov-value { font-size: 22px; font-weight: 700; line-height: 1.3; }
  .ov-value .unit { font-size: 13px; font-weight: 500; margin-left: 2px; }
  .ov-sub { font-size: 12px; color: var(--muted); }
  .ov-item.warn .ov-value, .ov-item.warn .ov-sub { color: var(--warn-strong); }
  button.ov-item:hover .ov-label { text-decoration: underline; }

  /* モデルのオン・オフ：スイッチは 32×18（つまみ 14）。押せる範囲は行の label 全体（最小の高さ 36px） */
  .toggle { display: flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; } /* 押せる範囲：スマホ 44px・広い幅 40px（3.5） */
  .toggle.locked { cursor: not-allowed; }
  .toggle input { appearance: none; -webkit-appearance: none; flex: none; width: 32px; height: 18px; margin: 0; border-radius: 9px; background: var(--seg); border: 1px solid var(--input-line); position: relative; cursor: inherit; }

  /* モデルの行：名前（押すと開く）・全体のスイッチ・開閉のボタン。モードごとのスイッチは普段は隠し、開くと上から下へすっと出る */

  /* 区分のタブ：文字を語の途中で割らない（狭い幅では文字と余白を小さくする） */
  .model-tabs { grid-auto-columns: minmax(max-content, 1fr); }

  @media (max-width: 430px) { .model-tabs > button { font-size: 13px; padding: 0 4px; } }
  @media (max-width: 359px) {

  }

  /* 切り替えが 2 つ以上（押すと開閉する）の状態の文字は折り返さない。1 つのモデルは折り返してよい（名前の欄を 96px 以上に保つ） */
  .tstate.mstate.clickable:not(.provider_off):not(.server_off):not(.global_off):not(.route_off) { max-width: none; white-space: nowrap; }
  .tstate.mstate:not(.clickable), .tstate.mstate.provider_off, .tstate.mstate.server_off, .tstate.mstate.global_off, .tstate.mstate.route_off { flex: 0 1 auto; min-width: 4.5em; }
  .tstate.mstate.clickable, .model-main.clickable { cursor: pointer; }
  .toggle.switch-only { padding: 0 6px; }
  .chev-btn, .chev-space { flex: none; width: 44px; height: 44px; }
  .chev-btn { display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; padding: 0; }
  .chev-btn:hover { background: var(--surface-2); color: var(--text); }
  .chev-btn svg { transition: transform 0.2s ease; }

  .tstate .tcount { display: block; font-weight: 400; }
  .modes-wrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.2s ease; }
  .modes-wrap.open { grid-template-rows: 1fr; }
  .modes { overflow: hidden; min-height: 0; visibility: hidden; transition: visibility 0s linear 0.2s; }
  .modes-wrap.open > .modes { visibility: visible; transition-delay: 0s; }
  .modes-in { margin-left: 12px; padding: 4px 6px 4px 12px; border-left: 2px solid var(--line-soft); }

  .save-bar { position: sticky; bottom: 0; z-index: 4; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; background: var(--surface); border-top: 1px solid var(--line); margin: 0 -16px -14px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); border-radius: 0 0 16px 16px; }
  .save-bar .save-state { margin-right: auto; font-size: 13px; color: var(--muted); }

  .venues { list-style: none; margin: 0; padding: 0; }

  .sub { font-size: 13px; color: var(--muted); }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .row-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .row-actions.end { justify-content: flex-end; }

  /* ---- 消費の推移（228。設定の［利用と上限］）----
     データの色は決まった 8 つ（dataviz の参照の色。並びは明暗とも validate_palette.js で確かめた：明 #FFFFFF・暗 #161B2B の背景で全項目 PASS。
     明るい配色の 3・4・5 番は背景との比が 3:1 未満〔2.82・2.17・2.69〕なので、値はホバーの内訳と「表で見る」でも読めるようにしてある）。
     色は項目に付ける（admin-lib.js の trendSeriesPlan）。9 つ目からは灰色の「その他」。その他はどの段の隣にも積まれるので、8 色のどれとも
     通常の見え方・1 型・2 型の色覚（Machado 2009）で OKLab の ΔE 8 以上になる灰を計算で選んだ（明 #6D7385：最小 8.9・背景との比 4.73／
     暗 #AAB0C2：最小 12.5・7.91。Codex TASK-0194 F194-02。前の #8C93A0・#6B7387 は 5 番の桃と 1.3・1.4 しか離れていなかった）。
     文字に色を付けない（凡例・内訳の色は四角と短い線だけ）。線は 1px の実線 */
  .trend {
    --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
    --series-5: #e87ba4; --series-6: #008300; --series-7: #6250d6; --series-8: #e34948;
    --series-other: #6D7385;
  }
  @media (prefers-color-scheme: dark) {
    .trend {
      --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
      --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-8: #e66767;
      --series-other: #AAB0C2;
    }
  }
  .trend .ser-1 { fill: var(--series-1); background: var(--series-1); }
  .trend .ser-2 { fill: var(--series-2); background: var(--series-2); }
  .trend .ser-3 { fill: var(--series-3); background: var(--series-3); }
  .trend .ser-4 { fill: var(--series-4); background: var(--series-4); }
  .trend .ser-5 { fill: var(--series-5); background: var(--series-5); }
  .trend .ser-6 { fill: var(--series-6); background: var(--series-6); }
  .trend .ser-7 { fill: var(--series-7); background: var(--series-7); }
  .trend .ser-8 { fill: var(--series-8); background: var(--series-8); }
  .trend .ser-other { fill: var(--series-other); background: var(--series-other); }
  .trend { gap: 12px; }
  .trend-controls { display: flex; flex-direction: column; gap: 8px; }
  .trend-switch > label { padding: 0 10px; white-space: nowrap; }
  @media (min-width: 640px) {
    .trend-controls { flex-direction: row; flex-wrap: wrap; align-items: center; }
    .trend-switch { grid-auto-columns: auto; }
    .trend-switch > label { padding: 0 14px; }
  }
  .trend-figure { display: flex; flex-direction: column; gap: 2px; }
  .trend-hero { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px; }
  .trend-hero-n { font-size: 32px; font-weight: 700; line-height: 1.15; color: var(--accent); } /* 大きな数は等幅の数字にしない */
  .trend-hero-u { font-size: 15px; font-weight: 600; color: var(--text-2); }
  .trend-sub { display: flex; flex-wrap: wrap; gap: 2px 14px; color: var(--text-2); font-size: 13px; }
  .trend-approx { padding: 8px 12px; border-radius: var(--r-s); background: var(--surface-2); color: var(--text-2); font-size: 13px; overflow-wrap: anywhere; }
  .trend-legend { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; }
  .trend-legend li { display: inline-flex; align-items: center; gap: 6px; min-width: 0; min-height: 24px; }
  .trend-legend-name { overflow-wrap: anywhere; }
  .trend-legend-val { color: var(--text-2); }
  .trend-swatch { flex: none; display: inline-block; width: 12px; height: 12px; border-radius: 3px; }
  .trend-plot { position: relative; min-width: 0; }
  .trend-svg { display: block; touch-action: pan-y; border-radius: 6px; }
  .trend-svg:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .trend-grid { stroke: var(--line); stroke-width: 1; shape-rendering: crispEdges; }
  .trend-base { stroke: var(--input-line); stroke-width: 1; shape-rendering: crispEdges; }
  .trend-tick, .trend-xlabel { fill: var(--muted); font-size: 11px; font-family: var(--font); font-variant-numeric: tabular-nums; }
  .trend-xlabel.today { fill: var(--text); font-weight: 700; }
  .trend-wash { fill: var(--surface-2); }
  .trend-seg.is-hover { filter: brightness(1.15) saturate(1.1); }
  /* 内訳：広い幅は棒の横に浮かべる（押せない・読むだけ）。狭い幅（.narrow）はグラフの下にいつも出す */
  .trend-tip {
    position: absolute; z-index: 2; pointer-events: none; width: max-content; max-width: min(300px, 100%);
    background: var(--surface); color: var(--text); border: 1px solid var(--line-2); border-radius: var(--r-m);
    box-shadow: var(--shadow-dialog); padding: 10px 12px; font-size: 13px; display: flex; flex-direction: column; gap: 4px;
  }
  .trend-plot.narrow .trend-tip { position: static; width: auto; max-width: none; box-shadow: none; background: var(--surface-2); border-color: transparent; margin-top: 6px; }
  .trend-tip .tip-title { font-weight: 700; }
  .trend-tip .tip-total b { font-size: 16px; }
  .trend-tip .tip-rows { list-style: none; margin: 2px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .trend-tip .tip-rows li { display: grid; grid-template-columns: 14px auto minmax(0, 1fr); align-items: baseline; column-gap: 6px; padding: 1px 4px; border-radius: 6px; }
  .trend-tip .tip-rows li.is-hover { background: var(--accent-soft); }
  .trend-tip .tip-key { width: 14px; height: 3px; border-radius: 2px; align-self: center; }
  .trend-tip .tip-unit { color: var(--text-2); }
  .trend-tip .tip-name { grid-column: 2 / -1; color: var(--text-2); overflow-wrap: anywhere; }
  .trend-tip .tip-empty { color: var(--text-2); }
  .trend-tip .tip-rows li.tip-part { padding-left: 24px; font-size: 12px; }
  .trend-parts { margin-top: 12px; min-width: 0; }
  .trend-parts-cap { caption-side: top; text-align: left; font-weight: 600; color: var(--text-2); padding: 0 0 4px; }
  .trend-empty { padding: 20px 12px; text-align: center; color: var(--muted); background: var(--surface-2); border-radius: var(--r-m); }
  .trend-table { border-collapse: collapse; font-size: 13px; min-width: 100%; }
  .trend-table th, .trend-table td { padding: 6px 10px; border-top: 1px solid var(--line-soft); text-align: right; white-space: nowrap; vertical-align: top; }
  .trend-table thead th { border-top: 0; color: var(--text-2); font-weight: 600; }
  .trend-table thead th .trend-swatch { margin-right: 6px; vertical-align: -1px; }
  .trend-table th[scope="row"] { text-align: left; font-weight: 600; }
  .trend-table tfoot th, .trend-table tfoot td { border-top: 2px solid var(--line); font-weight: 700; }
  .trend-table td > span { display: block; }
  .trend-table .trend-td-j { font-size: 12px; color: var(--text-2); font-weight: 400; }
  .trend-table .trend-td-none { color: var(--muted); }
  .trend-notes { display: flex; flex-direction: column; gap: 4px; }
  /* 狭い幅：グラフの下の［‹］［›］（44px 四方）と、なぞる操作の案内 */
  .trend-step { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .trend-step-hint { flex: 1 1 auto; min-width: 0; font-size: 12px; color: var(--text-2); text-align: center; }
  .trend-step-btn { font-size: 22px; line-height: 1; }

  /* ---- 下から出るシート（スマホ）／中央のダイアログ（PC） ---- */
  dialog.sheet {
    position: fixed; inset: auto 0 0 0; margin: 0; padding: 0; border: 0; width: 100%; max-width: 100%;
    max-height: calc(100dvh - 44px); border-radius: 22px 22px 0 0; background: var(--bg); color: var(--text); overflow: auto;
    overscroll-behavior: contain;
  }
  dialog.sheet::backdrop { background: var(--scrim); }
  .sheet-grab { width: 40px; height: 5px; border-radius: 3px; background: var(--dot); margin: 10px auto 0; }
  .sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 10px 16px 0; }
  .sheet-head h2 { font-size: 22px; font-weight: 700; padding-top: 6px; overflow-wrap: anywhere; }
  .sheet-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
  .sheet-foot { padding: 4px 16px calc(24px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; }
  .sheet-foot .btn.cancel { border: 0; background: transparent; color: var(--accent); font-weight: 600; }

  /* ---- PC（900px 以上）：表＋右のパネル／中央のダイアログ ---- */
  @media (min-width: 900px) {
    .mobile-only { display: none !important; }
    :root { --topbar-h: calc(65px + env(safe-area-inset-top)); } /* 900px 以上（1 段）。実測 65px */
    :root:has(body.selecting) { --topbar-h: 0px; }
    .topbar-inner { max-width: 1240px; margin: 0 auto; padding: 12px 24px; gap: 12px; }
    .brand h1 { font-size: 20px; }
    .account { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); min-width: 0; white-space: nowrap; }
    .account .icon-btn { width: 40px; height: 40px; border-radius: var(--r-s); color: var(--text); }
    .avatar { width: 40px; height: 40px; border-radius: var(--r-s); }
    /* 左のメニュー：縦に並べ、ヘッダーの下に貼り付ける。今いる所は、選んだ行と同じ組（--accent-soft の地と左の --accent の線） */
    .admin-shell { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: 184px minmax(0, 1fr); align-items: start; }
    .side-menu {
      position: sticky; top: var(--topbar-h); display: flex; flex-direction: column; gap: 4px; margin: 0; padding: 20px 0 20px 24px;
      background: transparent; border-radius: 0;
    }
    body.selecting .side-menu { display: flex; } /* 広い幅は選択中も残す（選択の見出しは名簿の枠の中） */
    .side-item { justify-content: flex-start; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: var(--r-s); font-size: 15px; font-weight: 600; }
    .side-item:hover { background: var(--surface-2); color: var(--text); }
    .side-item[aria-current="page"] { background: var(--accent-soft); color: var(--accent-soft-text); font-weight: 700; box-shadow: inset 3px 0 0 var(--accent); }
    .content { max-width: none; margin: 0; padding: 20px 24px 40px 16px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    body.selecting .content { padding-bottom: 120px; }
    body.selecting #overview { display: grid !important; }
    .overview { margin: 0; background: transparent; border: 0; padding: 0; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .ov-item { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
    .ov-item + .ov-item { border-left: 1px solid var(--line); }
    .ov-item.warn { background: var(--warn-card); border-color: var(--warn-line); }
    .ov-item.warn .ov-label { color: var(--warn-fg); }
    .ov-value { font-size: 24px; }
    .ov-line { display: none; }
    .split { display: flex; gap: 16px; align-items: flex-start; }
    .list-panel { flex: 999 1 560px; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; overflow: clip; } /* clip：角を丸く切るが、中の .selhead は貼り付ける */
    .stack-panel { flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
    .stack-panel > .list-panel { flex: none; }
    .stack-panel > .empty { margin: 0; }
    .settings { padding: 0; }
    .set-subtabs > button { min-height: 40px; padding: 0 18px; }
    .toggle, .toggle.master, .model-tabs > button { min-height: 40px; }
    .chev-btn, .chev-space { width: 40px; height: 40px; }
    .settings .box { padding: 18px 20px; }
    .set-item { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1fr); min-height: 48px; }
    .set-line { display: contents; }
    .set-change, .settings .btn, .set-bar .btn, .stale-line .btn { min-height: 40px; }
    .set-summary .sum-cost { font-size: 36px; }
    .ov-link { padding: 0; margin-top: -8px; }
    .save-bar { margin: 0 -20px -18px; padding: 12px 20px; }
    .side-panel {
      display: flex; flex-direction: column; gap: 14px; flex: 1 1 360px; min-width: 0; max-width: 440px; background: var(--surface); border: 1px solid var(--line);
      border-radius: 16px; padding: 18px; position: sticky; top: calc(var(--topbar-h) + 16px); max-height: calc(100vh - var(--topbar-h) - 32px); overflow: auto;
    }
    .side-panel .box, .side-panel .menu { background: var(--surface-2); border-color: transparent; }
    .side-panel .stat { background: var(--surface); }
    .side-panel .title-lg { font-size: 18px; }
    .side-panel .big-n { font-size: 32px; }
    .side-empty { color: var(--muted); padding: 24px 4px; text-align: center; }
    .panel-head { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line-soft); }
    body.selecting .panel-head { display: flex !important; }
    .panel-head h2 { display: block; font-size: 16px; font-weight: 700; margin-right: auto; }
    .panel-head .search { flex: 1 1 220px; max-width: 320px; }
    .panel-head .search input { height: 40px; font-size: 14px; border-radius: 10px; }
    .panel-head .search svg { top: 11px; }
    .panel-head .btn { min-height: 40px; border-radius: 10px; }
    .chips { padding: 12px 16px; border-bottom: 1px solid var(--line-soft); flex-wrap: wrap; }
    body.selecting .chips { display: flex !important; }
    .list { padding: 0; gap: 0; }
    .empty { margin: 16px; }
    .trow {
      display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 0.9fr) minmax(0, 1.8fr) minmax(0, 1.3fr); gap: 12px;
      padding: 12px 16px; min-height: 60px; align-items: center; width: 100%; border: 0; background: transparent; color: var(--text); text-align: left;
    }
    .list > li + li .trow, .list > li + li .pick { border-top: 1px solid var(--line-soft); }
    .trow.head { min-height: 0; padding: 10px 16px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line-soft); }
    .trow.cohort { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.4fr) minmax(0, 1.6fr) minmax(0, 0.8fr) minmax(0, 1.6fr); min-height: 64px; }
    button.trow:hover { background: var(--surface-2); }
    .trow.is-selected { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
    .cell { display: flex; flex-direction: column; gap: 2px; min-width: 0; align-items: flex-start; }
    .cell.stretch { align-items: stretch; gap: 4px; }
    .cell > * { max-width: 100%; }
    .pick { border-radius: 0; border: 0; min-height: 56px; padding: 10px 16px; }
    .pick:has(input:checked) { border: 0; padding: 10px 16px; background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
    .selhead { padding: calc(10px + env(safe-area-inset-top)) 16px 10px; border-bottom: 1px solid var(--line-soft); }
    .selhead h2 { font-size: 16px; }
    .sel-hint { padding: 10px 16px; border-bottom: 1px solid var(--line-soft); }
    .selectbar-inner { flex-direction: row; align-items: center; justify-content: flex-end; }
    .selectbar .btn.big { min-height: 44px; font-size: 14px; border-radius: 12px; padding: 0 20px; }
    .selectbar .row { grid-auto-columns: auto; }
    .fab { display: none; }
    .venues { padding: 0 16px; }
    .venues li { min-height: 56px; border-top: 0; }
    .venues li + li { border-top: 1px solid var(--line-soft); }
    .card-section-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line-soft); }
    .card-section-head h2 { font-size: 16px; font-weight: 700; margin-right: auto; }
    .cohort-dates { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .cohort-dates .day2-cell { grid-column: auto; order: 3; }
    .cohort-dates .preview-cell { order: 4; }
    .id-preview { background: var(--surface-2); border-radius: 12px; }
    .id-preview .hint { max-width: 240px; }

    dialog.sheet {
      inset: 0; margin: auto; width: min(600px, calc(100vw - 48px)); max-height: calc(100dvh - 96px); height: fit-content;
      border-radius: 18px; background: var(--surface); box-shadow: var(--shadow-dialog);
    }
    .sheet-grab { display: none; }
    .sheet-head { padding: 14px 16px 14px 22px; border-bottom: 1px solid var(--line-soft); align-items: center; }
    .sheet-head h2 { font-size: 18px; padding: 0; }
    .sheet-head .icon-btn { border: 0; width: 40px; height: 40px; }
    .sheet-body { padding: 20px 22px; gap: 16px; }
    .sheet-body .box { background: var(--surface-2); border-color: transparent; }
    .sheet-foot { flex-direction: row-reverse; justify-content: flex-start; gap: 10px; padding: 14px 22px 18px; border-top: 1px solid var(--line-soft); }
    .sheet-foot .btn.big { min-height: 42px; font-size: 14px; border-radius: 10px; padding: 0 20px; }
    .sheet-foot .btn.cancel { border: 1px solid var(--line-2); color: var(--text); }
    .input, select.input { height: 42px; border-radius: 10px; font-size: 15px; }
  }
  @media (min-width: 68.75em) {
    .set-split { display: flex; gap: var(--s4); align-items: flex-start; }
    .set-col { flex: 1 1 auto; }
    .set-aside:not([hidden]) {
      display: flex; flex-direction: column; gap: 14px; flex: 0 0 clamp(360px, 32vw, 420px); min-width: 0;
      position: sticky; top: calc(var(--topbar-h) + 16px); max-height: calc(100vh - var(--topbar-h) - 32px); overflow: auto;
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 18px;
    }
    .set-bar { display: none !important; }
    body.setbar .content { padding-bottom: 40px; }
    body.setbar .save-bar { bottom: 0; }
  }
  /* 横向きのスマホ（高さが低い）：画面を圧迫するので固定しない */
  @media (orientation: landscape) and (max-height: 500px) {
    :root, :root:has(body.selecting) { --topbar-h: 0px; }
    .topbar { position: static; }
  }
  @media (max-width: 899.98px) {
    .desk-only { display: none !important; }
    /* 名簿の要約：今日・今月の生成を並べるため、スマホは 2 列 × 2 行（右の列に ov-r） */
    .overview.ov-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 14px; }
    .overview.ov-4 .ov-item + .ov-item { border-left: 0; }
    .overview.ov-4 .ov-item.ov-r { border-left: 1px solid var(--line-soft); }
    .trow.head { display: none; }
  }
  @media (max-width: 360px) {
    .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .choice { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>
</head>
<body>
<div id="status" class="center-card"><p class="muted">読み込み中…</p></div>

<!-- ログイン前：トップ（index.html の #login）と同じ並び。上から ロゴ・名前（下に小さく画面の名前）・ログイン・方針と規約・小さな A.I.KEN -->
<section id="login" class="center-card welcome" hidden aria-labelledby="login-title login-sub">
  <picture class="brand-logo">
    <source srcset="/img/aiken-logo-white.png" media="(prefers-color-scheme: dark)">
    <img src="/img/aiken-logo.png" alt="A.I.KEN" width="120" height="84">
  </picture>
  <h1 id="login-title">A.I.KEN Studio</h1>
  <p class="brand-sub" id="login-sub">管理コンソール</p>
  <p class="warn-text" id="login-note" role="status" hidden></p>
  <button type="button" class="gsi-btn" id="login-btn"><span class="gsi-g" aria-hidden="true"></span><span class="gsi-label">Google でログイン</span></button>
  <nav class="links" aria-label="方針と規約">
    <a href="https://a-i-ken.com/privacy/">プライバシーポリシー</a>
    <a href="/terms.html">利用規約</a>
  </nav>
  <p class="foot">A.I.KEN</p>
</section>

<section id="denied" class="center-card" hidden aria-labelledby="denied-title">
  <span class="brand-sub">A.I.KEN Studio</span>
  <h1 id="denied-title">管理コンソール</h1>
  <p class="error-text">管理者の権限がありません。</p>
  <p class="muted">ログイン中のアカウント：<span id="denied-email" class="tabular"></span></p>
  <button type="button" class="btn" id="denied-logout-btn">ログアウト</button>
</section>

<div id="app" hidden>
  <header class="topbar">
    <!-- ヘッダーは 1 段（2026-10-23 田口さん）：左に題名、右に 画面の間の移動（共通の部品 site-nav.js・site-nav.css。ここに来るのは管理者だけ
         〔is_admin() が true のときだけ #app を出す〕なので Canvas・家・帽子・歯車〔今の画面の印〕の 4 つ。案内だけで守りは各画面と DB）
         → 読み直せていない印（そのときだけ）→ 更新 → アカウント（メール・確認の時刻・最新にする・ログアウトのシート）。
         説明の文字（「A.I.KEN Studio」・メール・「確認 HH:mm」）は置かない（メールと時刻はアカウントのシートにある）。
         ［名簿］［回］［設定］の切り替えはヘッダーから外し、下の左のメニュー（#side-menu）に移した -->
    <div class="topbar-inner">
      <div class="brand">
        <h1>管理コンソール</h1>
      </div>
      <nav class="site-nav" id="site-nav" aria-label="ページの移動" hidden></nav>
      <div class="account">
        <span id="checked-at" class="checked tabular"></span>
        <button type="button" class="icon-btn" id="reload-btn" aria-label="最新の状態を読み込む" data-tip="最新にする">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 11a8 8 0 1 0-2.34 5.66"/><path d="M20 4v7h-7"/></svg>
        </button>
      </div>
      <button type="button" class="avatar" id="account-btn" aria-label="アカウントと更新" title="アカウント" aria-haspopup="dialog" data-icon="circle-user-round"></button>
    </div>
  </header>

  <!-- 左のメニュー（2026-10-23 田口さん「管理コンソールこそ左にメニュー」）：［名簿］［回］［設定］の切り替え。広い幅（900px 以上）は左に縦に
       並べて貼り付け、狭い幅はヘッダーの下の細い横の切り替え（ヘッダーと一緒には貼り付けない）。今いる所は aria-current="page"。
       ボタンの id と押したときの動き（switchTab：保存していない変更の確かめ・保存の結果待ちの断り・選択の解除）は前のまま。
       作りはナビゲーション（nav と aria-current）のまま：押すと画面の中身が替わる移動で、タブと中身の組（tablist／tabpanel）ではないため -->
  <div class="admin-shell">
  <nav class="side-menu" id="side-menu" aria-label="表示の切り替え">
    <button type="button" class="side-item" id="tab-roster" aria-current="page" data-icon="users"><span>名簿</span></button>
    <button type="button" class="side-item" id="tab-cohorts" data-icon="calendar-days"><span>回</span></button>
    <button type="button" class="side-item" id="tab-settings" data-icon="sliders-horizontal"><span>設定</span></button>
  </nav>

  <main class="content">
    <section id="overview" class="overview" aria-label="概要"></section>
    <p id="overview-line" class="ov-line tabular" hidden></p>
    <p id="overview-link" class="ov-link" hidden></p>

    <div id="view-roster" class="split">
      <section class="list-panel" aria-labelledby="roster-title">
        <div id="roster-selhead"></div>
        <div class="panel-head">
          <h2 id="roster-title">名簿</h2>
          <div class="search">
            <label for="q" class="sr-only">名前・メールで検索</label>
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
            <input id="q" type="search" placeholder="名前・メールで検索" autocomplete="off">
          </div>
          <button type="button" class="btn desk-only" id="select-btn-desk">選択</button>
          <button type="button" class="btn primary desk-only" id="add-btn-desk">追加</button>
        </div>
        <div class="chips" role="group" aria-label="絞り込み" id="chips"></div>
        <div class="count-row">
          <span id="shown-count" class="tabular"></span>
          <button type="button" class="link-btn mobile-only" id="select-btn">選択</button>
        </div>
        <div id="roster-banner" role="status"></div>
        <div id="roster-list"></div>
      </section>
      <aside class="side-panel" id="roster-aside" aria-label="選んだ人の詳細"></aside>
    </div>

    <div id="view-cohorts" class="split" hidden>
      <div class="stack-panel" id="cohorts-main"></div>
      <aside class="side-panel" id="cohort-aside" aria-label="選んだ回の設定"></aside>
    </div>

    <div id="view-settings" class="settings" hidden>
      <h2 id="settings-title" class="sr-only">設定</h2>
      <!-- 設定の中の小さなタブ（決定 71）。押したものだけを下に出す。矢印キー・Home・End で移る -->
      <div class="seg set-subtabs" id="settings-subtabs" role="tablist" aria-label="設定の分類">
        <button type="button" role="tab" id="subtab-usage" aria-controls="settings-panel" aria-selected="true">利用と上限</button>
        <button type="button" role="tab" id="subtab-models" aria-controls="settings-panel" aria-selected="false" tabindex="-1">モデル</button>
        <button type="button" role="tab" id="subtab-templates" aria-controls="settings-panel" aria-selected="false" tabindex="-1">テンプレート</button>
        <button type="button" role="tab" id="subtab-history" aria-controls="settings-panel" aria-selected="false" tabindex="-1">履歴</button>
      </div>
      <div class="set-split">
        <div class="set-col" id="settings-panel" role="tabpanel" aria-labelledby="subtab-usage">
          <section id="settings-summary" class="box set-summary" aria-labelledby="sum-h"></section>
          <!-- 消費の推移（228：admin_usage_trend）。今月（日ごと）・直近 12 か月（月ごと）を、モデル・区分・回・種類で色分けした積み上げの棒（admin.js の renderTrend） -->
          <section id="settings-trend" class="box trend" aria-labelledby="trend-h" hidden></section>
          <div id="settings-main"></div>
          <div id="settings-storage"></div>
          <div id="settings-models"></div>
          <div id="settings-templates"></div>
          <div id="settings-history"></div>
        </div>
        <aside id="settings-aside" class="set-aside" aria-labelledby="aside-title" hidden></aside>
      </div>
    </div>
  </main>
  </div>

  <button type="button" class="fab" id="fab"></button>
  <div class="selectbar" id="selectbar" hidden></div>
  <div class="selectbar set-bar" id="settings-bar" hidden></div>
</div>

<dialog id="sheet" class="sheet" aria-labelledby="sheet-title"></dialog>
<dialog id="ask" class="ask" aria-labelledby="ask-title"></dialog>
<script type="module" src="/r/207cc7f43a5d/topbar-height.js"></script>
<script type="module" src="/r/207cc7f43a5d/admin.js"></script>
</body>
</html>
