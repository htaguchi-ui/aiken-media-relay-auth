<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src https://tnzwhwitgnzoehbjrmoy.supabase.co; style-src 'self' 'unsafe-inline'; img-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
