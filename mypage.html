<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js; connect-src https://tnzwhwitgnzoehbjrmoy.supabase.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
<!-- supabase-js は版を固定し、改ざんされていないことを integrity（SRI）で確かめてから使う（window.supabase）。CSP もこのファイルだけを許す -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
<title>A.I.KEN Studio マイページ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&amp;display=swap">
<style>
  :root {
    --accent: #26396E; --accent-hover: #1B2B55; --on-accent: #FFFFFF;
    --accent-soft: #EEF1F6; --accent-soft-line: #C8D0DE; --accent-soft-text: #22325E;
    --bg: #F4F5F8; --surface: #FFFFFF;
    --text: #16181D; --text-2: #4A505B; --muted: #5B6270;
    --line: #E3E6EB; --line-2: #DDE1E7; --line-soft: #EEF0F3; --input-line: #C9CED6;
    --track: #E9ECF1;
    --student-bg: #E6EAF2; --student-fg: #22325E;
    --member-bg: #E5ECEA; --member-fg: #355A54;
    --admin-bg: #ECEDF0; --admin-fg: #30343B;
    --instructor-bg: #ECE8F2; --instructor-fg: #4A3A66;
    --ok-bg: #E7EDE8; --ok-fg: #3D5B45;
    --warn-fg: #74512C;
    --low: #A0573A; --low-text: #8A4B33;
    --danger: #96413A;
    --font: "IBM Plex Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
  }
  /* ダーク表示：紺基調のまま明度を反転（管理コンソールと同じ） */
  @media (prefers-color-scheme: dark) {
    :root {
      --accent: #A9B9E9; --accent-hover: #C3CFF2; --on-accent: #0E1322;
      --accent-soft: #1E2741; --accent-soft-line: #34406A; --accent-soft-text: #C7D2F2;
      --bg: #0E1220; --surface: #161B2B;
      --text: #E8EAF0; --text-2: #C2C7D2; --muted: #A0A7B6;
      --line: #283048; --line-2: #323B54; --line-soft: #222A3E; --input-line: #3C4661;
      --track: #262E44;
      --student-bg: #243052; --student-fg: #C7D2F2;
      --member-bg: #1E3532; --member-fg: #A9D0C6;
      --admin-bg: #2A2E39; --admin-fg: #D0D4DC;
      --instructor-bg: #2E2640; --instructor-fg: #D2C6EC;
      --ok-bg: #1F3527; --ok-fg: #A9D4B4;
      --warn-fg: #EBC79C;
      --low: #D8916F; --low-text: #EBA887;
      --danger: #EE968C;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: var(--font); font-size: 15px; line-height: 1.7;
  }
  [hidden] { display: none !important; }
  .tabular { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .error-text { color: var(--danger); }
  .warn-text { color: var(--warn-fg); font-weight: 600; }
  h1, h2, h3, p { margin: 0; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- ボタン ---- */
  .btn {
    min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line-2);
    background: var(--surface); color: var(--text); font-weight: 700; font-size: 14px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
  }
  .btn:hover:not(:disabled) { border-color: var(--input-line); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn.big { min-height: 52px; border-radius: 14px; font-size: 16px; }
  .btn.compact { min-height: 36px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
  .btn:disabled { opacity: 0.55; }

  /* ---- バッジ ---- */
  .badge { flex: none; display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; padding: 1px 10px; border-radius: 999px; white-space: nowrap; line-height: 1.6; }
  .badge.student { background: var(--student-bg); color: var(--student-fg); }
  .badge.member { background: var(--member-bg); color: var(--member-fg); }
  .badge.admin { background: var(--admin-bg); color: var(--admin-fg); }
  .badge.instructor { background: var(--instructor-bg); color: var(--instructor-fg); }
  .tag { display: inline-block; margin-left: 8px; font-size: 11px; font-weight: 600; padding: 0 8px; border-radius: 999px; white-space: nowrap; line-height: 1.6; vertical-align: 1px; }
  .tag.default { background: var(--ok-bg); color: var(--ok-fg); }
  .tag.image-only { background: var(--accent-soft); color: var(--accent-soft-text); border: 1px solid var(--accent-soft-line); }

  /* ---- 読み込み・ログイン・エラー ---- */
  .center-card { max-width: 440px; margin: 14vh auto 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 32px 28px; display: flex; flex-direction: column; gap: 16px; }
  .center-card h1 { font-size: 22px; }
  .center-card .row { display: flex; flex-wrap: wrap; gap: 8px; }
  @media (max-width: 480px) { .center-card { margin: 10vh 16px 0; padding: 28px 22px; } }

  /* ---- 上部の帯 ---- */
  .topbar { background: var(--surface); border-bottom: 1px solid var(--line); }
  .topbar-inner { max-width: 720px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 14px 20px; }
  .topbar h1 { font-size: 17px; font-weight: 700; letter-spacing: 0.01em; min-width: 0; }
  .account { display: flex; align-items: center; justify-content: flex-end; gap: 8px 12px; min-width: 0; }
  .account .who { display: flex; align-items: center; gap: 8px; min-width: 0; }
  #me-email { max-width: 260px; font-size: 13px; }
  @media (max-width: 560px) {
    .topbar-inner { padding: 10px 16px; }
    .account { width: 100%; justify-content: space-between; }
    .account .who { flex: 1 1 auto; }
    #me-email { max-width: none; }
  }

  /* ---- 本体 ---- */
  .content { max-width: 720px; margin: 0 auto; padding: 28px 20px 96px; display: flex; flex-direction: column; gap: 20px; }
  @media (max-width: 560px) { .content { padding: 20px 16px 72px; gap: 16px; } }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  @media (max-width: 560px) { .card { padding: 20px 18px; } }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .card h2 { font-size: 16px; font-weight: 700; }

  .big-number { display: flex; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; }
  .big-number .value { font-size: 56px; font-weight: 700; line-height: 1.1; letter-spacing: 0.01em; color: var(--accent); }
  .big-number .value.text { font-size: 32px; }
  .big-number .limit { font-size: 15px; color: var(--muted); font-weight: 500; }
  .big-number.low .value { color: var(--low-text); }
  @media (max-width: 560px) { .big-number .value { font-size: 48px; } .big-number .value.text { font-size: 28px; } }
  .bar { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
  .bar > span { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
  .bar.low > span { background: var(--low); }
  .slot-line { color: var(--text-2); }
  .notice { color: var(--text-2); font-size: 16px; }
  .stage-name { font-size: 17px; font-weight: 700; overflow-wrap: anywhere; }
  .stage-name .tag { margin-left: 0; margin-right: 8px; }
  ul.stages { list-style: none; margin: 0; padding: 0; }
  ul.stages li { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 4px 12px; padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
  ul.stages li:last-child { border-bottom: 0; }
  ul.stages li.current { font-weight: 700; }
  ul.stages .name { overflow-wrap: anywhere; }
  ul.stages .num { color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 500; }

  /* ---- モデル ---- */
  .kind-group { display: flex; flex-direction: column; gap: 4px; }
  .kind-group + .kind-group { margin-top: 12px; }
  .kind-group h3 { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
  ul.models { list-style: none; margin: 0; padding: 0; }
  ul.models li { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
  ul.models li:last-child { border-bottom: 0; }
  ul.models .name { font-weight: 600; overflow-wrap: anywhere; }
  ul.models .price { color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  @media (max-width: 400px) { ul.models li { font-size: 14px; gap: 8px; } }
</style>
</head>
<body>
<div id="status" class="center-card" role="status"><p class="muted">読み込み中…</p></div>

<section id="login" class="center-card" hidden aria-labelledby="login-title">
  <h1 id="login-title">マイページ</h1>
  <p class="warn-text" id="login-note" role="status" hidden></p>
  <p>研修・A.I.KEN の Google アカウントでログインしてください。</p>
  <button type="button" class="btn primary big" id="login-btn">Google でログイン</button>
  <p class="muted small">このページを閉じたり、ほかのページへ移ったりすると、ログアウトします（再読み込みのときは自動でログインし直します）。</p>
</section>

<section id="denied" class="center-card" hidden aria-labelledby="denied-title">
  <h1 id="denied-title">マイページ</h1>
  <p class="error-text" id="denied-message">利用登録が確認できません。管理者にお問い合わせください。</p>
  <p class="muted small"><span id="denied-email" class="tabular"></span></p>
  <div class="row"><button type="button" class="btn" id="denied-logout-btn">ログアウト</button></div>
</section>

<section id="failed" class="center-card" hidden aria-labelledby="failed-title">
  <h1 id="failed-title">マイページ</h1>
  <p class="error-text" id="failed-message">読み込めませんでした。</p>
  <div class="row">
    <button type="button" class="btn primary" id="retry-btn">もう一度試す</button>
    <button type="button" class="btn" id="failed-logout-btn">ログアウト</button>
  </div>
</section>

<div id="app" hidden>
  <header class="topbar">
    <div class="topbar-inner">
      <h1>A.I.KEN Studio マイページ</h1>
      <div class="account">
        <div class="who">
          <span id="me-email" class="ellipsis tabular"></span>
          <span id="me-role" class="badge"></span>
        </div>
        <button type="button" class="btn compact" id="logout-btn">ログアウト</button>
      </div>
    </div>
  </header>

  <main class="content">
    <section class="card" aria-labelledby="credits-title">
      <div class="card-head">
        <h2 id="credits-title">残りクレジット</h2>
        <button type="button" class="btn compact" id="reload-btn">最新にする</button>
      </div>
      <div class="big-number" id="big-number">
        <span class="value tabular" id="credits-value">—</span>
        <span class="limit tabular" id="credits-limit"></span>
      </div>
      <div class="bar" id="credits-bar" hidden><span id="credits-bar-fill"></span></div>
      <p class="stage-name" id="stage-name" hidden></p>
      <p class="slot-line" id="slot-line" hidden></p>
      <p class="notice" id="credits-notice" hidden></p>
    </section>

    <section class="card" id="stages-card" aria-labelledby="stages-title" hidden>
      <div class="card-head">
        <h2 id="stages-title">今日の段階</h2>
      </div>
      <ul class="stages" id="stages"></ul>
      <p class="muted small" id="stage-note"></p>
    </section>

    <section class="card" aria-labelledby="models-title">
      <div class="card-head">
        <h2 id="models-title">使えるモデル</h2>
        <span class="muted small">目安はクレジット</span>
      </div>
      <div id="models"></div>
    </section>
  </main>
</div>
<script type="module" src="./mypage.js"></script>
</body>
</html>
